# Databricks Asset Bundle for the coati agent.
# dev:  Free Edition, for building and evals (non-commercial use only).
# prod: a pay-as-you-go workspace, for the public Agent Lab page (spec D0b).
bundle:
  name: coati-agent

variables:
  model:
    description: Foundation Model API endpoint the agent calls (spec D2).
    default: databricks-qwen35-122b-a10b
  embedding_model:
    description: Embedding endpoint for the docs index (spec D1).
    default: databricks-gte-large-en
  catalog:
    description: Unity Catalog catalog for the agent's schema.
    default: workspace
  model_version:
    description: The registered coati_agent version to serve (scripts/log_model.py prints it).
    default: "3"
  experiment_id:
    description: MLflow experiment the endpoint's traces go to (/Users/<you>/coati-agent).
    default: "795534058228195"

artifacts:
  wheel:
    type: whl
    build: uv build --wheel
    path: .

resources:
  schemas:
    coati_agent:
      catalog_name: ${var.catalog}
      name: coati_agent
      comment: The coati agent's artifacts (docs index, later its model).

  volumes:
    artifacts:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.coati_agent.name}
      name: artifacts
      volume_type: MANAGED
      comment: Built docs indexes, one folder per build.

  jobs:
    embed_docs:
      name: coati-agent embed_docs
      description: Chunks the exported docs and embeds them into an index in the artifacts volume (spec D1).
      max_concurrent_runs: 1
      tasks:
        - task_key: embed
          environment_key: default
          python_wheel_task:
            package_name: coati_agent
            entry_point: coati-index
            parameters:
              - --out
              - /Volumes/${var.catalog}/${resources.schemas.coati_agent.name}/${resources.volumes.artifacts.name}/index
              - --endpoint
              - ${var.embedding_model}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

  model_serving_endpoints:
    agent_endpoint:
      name: coati-agent
      description: The Latitude 10 support agent (spec 2026-11-09). CPU, scales to zero.
      config:
        served_entities:
          - name: coati-agent
            entity_name: ${var.catalog}.${resources.schemas.coati_agent.name}.coati_agent
            entity_version: ${var.model_version}
            workload_size: Small
            scale_to_zero_enabled: true
            environment_vars:
              ENABLE_MLFLOW_TRACING: "true"
              MLFLOW_EXPERIMENT_ID: ${var.experiment_id}

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: coati-free

  prod:
    mode: production
    workspace:
      profile: coati-paid
