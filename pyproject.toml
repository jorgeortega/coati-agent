[project]
name = "coati-agent"
version = "0.1.0"
description = "The Latitude 10 support agent on Databricks: a small tool-calling harness with retrieval, MLflow tracing and evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jorge Ortega" }]
requires-python = ">=3.12"
dependencies = [
  "mlflow~=3.18.0",
  "databricks-sdk~=0.163.0",
  "httpx~=0.28",
  "openai~=3.48.0",
  "numpy~=2.5.4",
]

[dependency-groups]
dev = [
  "databricks-agents~=1.13.0",  # Databricks' managed judges, for evals only
  "pytest~=9.2.0",
  "ruff~=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
coati-index = "coati_agent.index:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coati_agent"]

[tool.hatch.build.targets.wheel.force-include]
# The site's export, hash-checked by prompt.py, travels inside the wheel.
"data/docs.jsonl" = "coati_agent/data/docs.jsonl"
"data/manifest.json" = "coati_agent/data/manifest.json"
"data/rules.txt" = "coati_agent/data/rules.txt"
"data/site-summary.md" = "coati_agent/data/site-summary.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept one instruction per line, unwrapped.
"src/coati_agent/prompt.py" = ["E501"]
