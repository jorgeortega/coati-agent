[project]
name = "coati-agent"
version = "0.1.0"
description = "The Latitude 10 support agent on Databricks: a small tool-calling harness with retrieval, MLflow tracing and evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jorge Ortega" }]
requires-python = ">=3.12"
dependencies = [
  "mlflow~=3.18.0",
  "databricks-sdk~=0.163.0",
  "openai~=3.48.0",
  "numpy~=2.5.4",
]

[dependency-groups]
dev = [
  "pytest~=9.2.0",
  "ruff~=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coati_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
